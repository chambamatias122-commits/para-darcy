<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Darcy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14101a;--paper:#ffffff;--pink:#ff3d97;--sky:#aab9f7;--blush:#ffd3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--ink);color:var(--paper);font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;line-height:1.35;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;opacity:.07;background:conic-gradient(var(--paper) 25%,transparent 0 50%,var(--paper) 0 75%,transparent 0) 0 0/56px 56px}
main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;max-width:560px;margin:0 auto;text-align:center}
section{display:none;width:100%;flex-direction:column;align-items:center;gap:18px}
section.on{display:flex}
h1{font-weight:700;font-size:clamp(2rem,9vw,3rem);line-height:1.05;margin:0;letter-spacing:-.01em}
p{margin:0;font-size:1.1rem}
.btn{font:inherit;font-weight:700;font-size:1.15rem;border:0;border-radius:999px;padding:14px 30px;cursor:pointer;background:var(--pink);color:var(--paper);box-shadow:0 5px 0 #a3125e;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a3125e}
.btn:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 #8b8794}
.heart{width:96px;height:auto;filter:drop-shadow(0 6px 0 rgba(255,61,151,.6))}
.polaroid{background:var(--paper);color:var(--ink);padding:12px 12px 14px;width:min(78vw,340px);box-shadow:0 8px 0 rgba(255,61,151,.55);transform:rotate(var(--r,-2deg))}
.polaroid img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--sky)}
.polaroid .cap{font-size:1.25rem;font-weight:700;margin-top:10px}
.polaroid .sub{font-size:.98rem;opacity:.8;margin-top:2px}
.polaroid.swap{animation:swap .4s ease-out}
@keyframes swap{from{transform:translateX(40px) rotate(6deg);opacity:0}to{opacity:1}}
.dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:50%;background:#4b4458}.dots i.on{background:var(--pink)}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:70px}
#no{touch-action:manipulation}
#no.fly{position:fixed;z-index:5}
.strip{width:min(60vw,220px);box-shadow:0 8px 0 rgba(255,61,151,.55);transform:rotate(3deg)}
.note{max-width:30ch;font-size:1.15rem}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){.polaroid.swap{animation:none}.btn{transition:none}}
</style></head><body>

<pattern id="chk" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#fff"/><rect width="10" height="10" fill="#14101a"/><rect x="10" y="10" width="10" height="10" fill="#14101a"/></pattern>
<symbol id="hrt" viewBox="0 0 100 90"><path d="M50 86C14 58 2 38 2 24 2 11 12 2 25 2c11 0 21 6 25 16C54 8 64 2 75 2c13 0 23 9 23 22 0 14-12 34-48 62z" fill="url(#chk)" stroke="#14101a" stroke-width="3"/></symbol></defs></svg>
<main>
<section id="s0" class="on">
<svg class="heart" viewBox="0 0 100 90" aria-hidden="true"><use href="#hrt"/></svg>
<h1>Darcy, Rolando te quiere preguntar algo</h1>
<p>Pero primero, mira lo que hemos vivido.</p>
<button class="btn" id="start">Empezar</button>
</section>
<section id="s1">
<figure class="polaroid" id="card" style="margin:0"><img id="pimg" alt=""><figcaption><div class="cap" id="pcap"></div><div class="sub" id="psub"></div></figcaption></figure>
<div class="dots" id="dots" aria-hidden="true"></div>
<button class="btn" id="next">Siguiente</button>
</section>
<section id="s2">
<svg class="heart" viewBox="0 0 100 90" aria-hidden="true"><use href="#hrt"/></svg>
<p>Valoro muchísimo tu apoyo y los momentos bonitos que pasamos. Te amo mucho.</p>
<h1>¿Quieres ser mi enamorada?</h1>
<div class="row" id="row"><button class="btn" id="yes">Sí</button><button class="btn ghost" id="no">No</button></div>
<p style="opacity:.7">— Rolando</p>
</section>

const $=id=>document.getElementById(id);let i=0;
function show(n){document.querySelectorAll("section").forEach((s,k)=>s.classList.toggle("on",k===n))}
function photo(){const p=P[i],c=$("card");$("pimg").src=p[0];$("pimg").alt=p[1];$("pimg").style.objectPosition=p[3];
$("pcap").textContent=p[1];$("psub").textContent=p[2];c.style.setProperty("--r",p[4]+"deg");c.classList.remove("swap");void c.offsetWidth;c.classList.add("swap");
$("dots").innerHTML=P.map((_,k)=>"<i class='"+(k===i?"on":"")+"'></i>").join("");$("next").textContent=i===P.length-1?"Ya casi":"Siguiente"}
$("start").onclick=()=>{show(1);photo()};
$("next").onclick=()=>{if(i<P.length-1){i++;photo()}else show(2)};
const msgs=["No","¿Segura?","Piénsalo bien","Mira mi carita","Última oportunidad","Mejor di que sí"];let tries=0;
const no=$("no"),yes=$("yes");
function dodge(e){e.preventDefault();tries++;no.textContent=msgs[Math.min(tries,msgs.length-1)];
yes.style.transform="scale("+Math.min(1+tries*.18,2.1)+")";yes.style.margin=(tries*3)+"px "+(tries*6)+"px";
const w=window.innerWidth,h=window.innerHeight,r=no.getBoundingClientRect();
no.classList.add("fly");const x=Math.random()*(w-r.width-24)+12,y=Math.random()*(h-r.height-24)+12;
no.style.left=x+"px";no.style.top=y+"px"}
no.addEventListener("pointerdown",dodge);no.addEventListener("click",e=>e.preventDefault());
no.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")dodge(e)});
yes.onclick=()=>{show(3);boom()};
function boom(){const c=$("fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
const cols=["#ff3d97","#aab9f7","#ffffff","#ffd3e6"];
const ps=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,v:2+Math.random()*3,s:8+Math.random()*10,c:cols[Math.random()*4|0],h:Math.random()<.5,w:Math.random()*6}));
let f=0;(function t(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.w+=.05)*1.2;x.fillStyle=p.c;
if(p.h){x.font=p.s*1.8+"px sans-serif";x.fillText("♥",p.x,p.y)}else x.fillRect(p.x,p.y,p.s,p.s*.6)});
if(++f<300)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})()}
</script></body></html>
